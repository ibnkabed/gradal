# Gradal iPhone app (XcodeGen). Built unsigned by .github/workflows/build-ipa.yml.
name: Gradal
options:
  bundleIdPrefix: io.github.ibnkabed
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  Gradal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Gradal
      - path: ../shared/sheet-layouts.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ibnkabed.gradal
        PRODUCT_NAME: Gradal
        INFOPLIST_FILE: Gradal/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
  # CI only: checks the Swift sheet reader on synthetic photos, writes a sample record .xlsx and computes
  # sheet geometries for tools/check_geometry.py.
  OMRCheck:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Gradal/OMR
      - path: Gradal/Record
      - path: Gradal/Model/Models.swift
      - path: Gradal/Model/Grading.swift
      - path: Gradal/Sheet/SheetGeometry.swift
      - path: Gradal/Sheet/AnswerSheetPDF.swift
      - path: Gradal/Import
      - path: Gradal/AI/AIProviders.swift
      - path: Gradal/Exam/ExamRules.swift
      - path: OMRCheck
    settings:
      base:
        PRODUCT_NAME: OMRCheck
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_USER_SCRIPT_SANDBOXING: NO
