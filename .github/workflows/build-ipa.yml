# Gradal iPhone app: checks the Swift sheet reader on synthetic photos, then builds an unsigned
# IPA for Sideloadly. A pushed tag v* also attaches the IPA to a GitHub Release.
name: Build Gradal IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    name: Check OMR and build unsigned Gradal IPA
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            ios
            shared
            tools
            pc/omr.py
            pc/sheet_layout.py
          sparse-checkout-cone-mode: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Make synthetic test sheets
        run: |
          set -euo pipefail
          python -m pip install --quiet pillow numpy opencv-python-headless openpyxl
          python tools/make_test_sheets.py 40 "$RUNNER_TEMP/sheets" 1448

      - name: Build OMRCheck
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Gradal.xcodeproj \
            -scheme OMRCheck \
            -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/omr-build" \
            build

      - name: Run the Swift reader on the test sheets
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/omr-build/Build/Products/Release/OMRCheck" "$RUNNER_TEMP/sheets" shared/sheet-layouts.json

      - name: Check the record sheet written by the Swift xlsx writer
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/omr-build/Build/Products/Release/OMRCheck" --xlsx "$RUNNER_TEMP/record.xlsx"
          python tools/check_record_xlsx.py "$RUNNER_TEMP/record.xlsx"

      - name: Build for a physical iPhone without signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/Gradal.xcodeproj \
            -scheme Gradal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          app_path="ios/build/Build/Products/Release-iphoneos/Gradal.app"
          test -d "$app_path"
          mkdir -p artifact/Payload
          ditto "$app_path" "artifact/Payload/Gradal.app"
          cd artifact
          /usr/bin/zip -qry Gradal-unsigned.ipa Payload
          shasum -a 256 Gradal-unsigned.ipa > Gradal-unsigned.ipa.sha256

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gradal-unsigned-IPA
          path: |
            artifact/Gradal-unsigned.ipa
            artifact/Gradal-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach the IPA to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-unsigned-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: Gradal-unsigned-IPA
          path: artifact

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifact/Gradal-unsigned.ipa
            artifact/Gradal-unsigned.ipa.sha256
